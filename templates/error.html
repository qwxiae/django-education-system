{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error {{ status }}</title>
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
    <style>
        body {
            font-family: system-ui;
            background: #0f0f17;
            color: #e5e5e5;

            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            text-align: center;
            padding: 2.5rem 2rem;
            border: 1px solid #2a2a35;
            border-radius: 14px;
            background: #1a1a25;
            max-width: 420px;
            width: 100%;

            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .status {
            color: #a855f7;
            font-size: 3rem;
            font-weight: 700;
            margin: 0;
        }

        h1 {
            margin: 0.5rem 0 1rem;
            font-size: 1.4rem;
        }

        p {
            color: #aaa;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            background: #2a2a35;
            color: #e5e5e5;
            text-decoration: none;
            transition: 0.15s;
        }

        a:hover {
            background: #3a3a48;
        }

        .card {
        animation: pop 0.25s ease-out;
        }

    @keyframes pop {
        from { transform: scale(0.98); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    </style>
</head>

<body>
    <div class="card">
        <div class="status">{{ status }}</div>

        <h1>Something went wrong</h1>

        <p>{{ message|default:"An unexpected error occurred." }}</p>

        <a href="/">Go back home</a>
    </div>
</body>
</html>
